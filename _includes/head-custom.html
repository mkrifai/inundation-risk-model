<!-- Mermaid JS with Interactive Fullscreen Zoom & Pan Modal Lightbox -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'default' });

  function setupMermaid() {
    try {
      const codeBlocks = document.querySelectorAll('pre code.language-mermaid, pre.mermaid, code.language-mermaid');
      codeBlocks.forEach((codeEl) => {
        const pre = codeEl.tagName === 'PRE' ? codeEl : codeEl.closest('pre') || codeEl;
        
        const card = document.createElement('div');
        card.className = 'mermaid-card';

        const toolbar = document.createElement('div');
        toolbar.className = 'mermaid-toolbar';
        toolbar.innerHTML = `
          <span class="mermaid-label">📐 Interactive Architecture Diagram</span>
          <button type="button" class="btn-mermaid-expand" title="Buka diagram layar penuh untuk zoom & pan">
            🔍 Klik untuk Memperbesar / Fullscreen
          </button>
        `;

        const mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.textContent = codeEl.textContent;

        card.appendChild(toolbar);
        card.appendChild(mermaidDiv);
        pre.parentNode.replaceChild(card, pre);
      });

      mermaid.run({ querySelector: '.mermaid' }).then(() => {
        attachLightboxEvents();
      });
    } catch (err) {
      console.error('Mermaid initialization error:', err);
    }
  }

  function attachLightboxEvents() {
    const cards = document.querySelectorAll('.mermaid-card');
    cards.forEach(card => {
      const btn = card.querySelector('.btn-mermaid-expand');
      const mermaidDiv = card.querySelector('.mermaid');
      if (btn && mermaidDiv) {
        btn.onclick = (e) => {
          e.stopPropagation();
          openLightbox(mermaidDiv);
        };
        mermaidDiv.style.cursor = 'zoom-in';
        mermaidDiv.title = 'Klik untuk memperbesar / fullscreen';
        mermaidDiv.onclick = () => openLightbox(mermaidDiv);
      }
    });
  }

  let currentScale = 1;
  let panX = 0;
  let panY = 0;
  let isDragging = false;
  let startX = 0;
  let startY = 0;

  function openLightbox(mermaidDiv) {
    let modal = document.getElementById('mermaid-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'mermaid-modal';
      modal.innerHTML = `
        <div class="mermaid-modal-backdrop"></div>
        <div class="mermaid-modal-header">
          <div class="mermaid-modal-title">
            <span>📐 Computational &amp; Theoretical Architecture</span>
            <small style="display:block; font-size:12px; color:#94a3b8; font-weight:normal;">Gunakan mouse drag untuk menggeser, scroll untuk zoom in/out</small>
          </div>
          <div class="mermaid-modal-controls">
            <button type="button" id="mm-zoom-in" title="Perbesar (Zoom In)">➕ Zoom In</button>
            <button type="button" id="mm-zoom-out" title="Perkecil (Zoom Out)">➖ Zoom Out</button>
            <button type="button" id="mm-zoom-reset" title="Reset Ukuran Semula">⟲ Reset</button>
            <button type="button" id="mm-close" title="Tutup Modal (ESC)">✕ Tutup</button>
          </div>
        </div>
        <div class="mermaid-modal-viewport" id="mermaid-viewport">
          <div class="mermaid-modal-content" id="mermaid-content"></div>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('.mermaid-modal-backdrop').onclick = closeLightbox;
      modal.querySelector('#mm-close').onclick = closeLightbox;
      modal.querySelector('#mm-zoom-in').onclick = () => zoom(0.25);
      modal.querySelector('#mm-zoom-out').onclick = () => zoom(-0.25);
      modal.querySelector('#mm-zoom-reset').onclick = resetZoom;

      const viewport = modal.querySelector('#mermaid-viewport');

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.15 : -0.15;
        zoom(delta);
      }, { passive: false });

      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.mermaid-modal-controls')) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        viewport.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        if (viewport) viewport.style.cursor = 'grab';
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          closeLightbox();
        }
      });
    }

    const content = modal.querySelector('#mermaid-content');
    content.innerHTML = mermaidDiv.innerHTML;
    const svg = content.querySelector('svg');
    if (svg) {
      svg.style.maxWidth = 'none';
      svg.style.width = 'auto';
      svg.style.height = 'auto';
      svg.style.minWidth = '900px';
    }

    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    resetZoom();
  }

  function zoom(amount) {
    currentScale = Math.max(0.3, Math.min(6.0, currentScale + amount));
    updateTransform();
  }

  function resetZoom() {
    currentScale = 1;
    panX = 0;
    panY = 0;
    updateTransform();
  }

  function updateTransform() {
    const content = document.getElementById('mermaid-content');
    if (content) {
      content.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
    }
  }

  function closeLightbox() {
    const modal = document.getElementById('mermaid-modal');
    if (modal) {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupMermaid);
  } else {
    setupMermaid();
  }
</script>
