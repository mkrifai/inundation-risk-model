[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inundation-risk"
version = "1.0.0"
description = "A Generalized Open-Source Framework for Regional Inundation and Multi-Hazard Risk Modeling"
readme = "README.md"
authors = [
    { name = "Mochamad Khoirul Rifai", email = "mochamadkhoirulrifai25@gmail.com" }
]
license = { text = "BSD-3-Clause" }
keywords = [
    "inundation",
    "flood",
    "hazard",
    "risk",
    "machine-learning",
    "hydroclimate",
    "geospatial"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology"
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "pyproj>=3.5.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "lightgbm>=4.0.0",
    "shap>=0.42.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0"
]

[project.scripts]
inundation-risk = "inundation_risk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inundation_risk*"]
